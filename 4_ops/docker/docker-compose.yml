# Local development stack: API + PostgreSQL + Redis.
# Run with: docker compose -f 4_ops/docker/docker-compose.yml up

version: "3.9"

services:
  api:
    build:
      context: ../../
      dockerfile: 4_ops/docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env.example
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
